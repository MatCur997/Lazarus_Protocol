<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigatore LAZZARO</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body class="app">
<header class="testata">
  <div class="riga-alta">
    <div class="marchio">
      <div class="logo"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5.5 5.5"/></svg></div>
      <div>Lazzaro<small>Investigatore AI · solo locale</small></div>
    </div>
    <div class="spazio"></div>
    <label class="ricerca-alta" title="Cerca una parola in tutti i documenti">
      <input id="cerca-documenti" placeholder="Cerca nei documenti…" autocomplete="off">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <label class="scelta-modello">Modello
      <select id="modello"></select>
    </label>
    <button class="tema-btn" id="tema" title="Cambia tema: chiaro (carta) o scuro">
      <span class="per-scuro"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Scuro</span>
      <span class="per-chiaro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Chiaro</span>
    </button>
    <a class="accesso-segreto" href="bacheca.html" target="_blank" title="Bacheca dell'investigatore: indizi e ipotesi collegati dai fili rossi">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Accesso Segreto</a>
  </div>
  <nav class="barra-stato">
    <span class="pillola attiva"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Centrale</span>
    <span class="pillola" id="stato-ollama"><i class="punto"></i>Ollama</span>
    <span class="pillola" id="stato-embedding"><i class="punto"></i>Embedding</span>
    <span class="pillola" id="stato-documenti"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>— documenti</span>
    <span class="pillola" id="stato-media"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>media —</span>
  </nav>
</header>

<main class="griglia">
  <!-- ======================================================= SINISTRA -->
  <section class="pannello sinistra">
    <div class="icone-schede" role="tablist">
      <button class="icona-scheda attiva" data-scheda="storico" title="Storico domande e risposte">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Storico</button>
      <button class="icona-scheda" data-scheda="strumenti" title="Strumenti usati dal modello">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Strumenti</button>
      <button class="icona-scheda" data-scheda="tempi" title="Tempi di risposta">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Tempi</button>
      <button class="icona-scheda" data-scheda="documenti" title="Documenti nell'indice">
        <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Documenti</button>
    </div>
    <div class="titolo-pannello"><h2 id="titolo-sinistra">Storico</h2><span class="conta" id="conta-sinistra"></span>
      <button class="btn-piccolo grigio" id="svuota-storico" title="Cancella tutte le domande dello storico" hidden>Svuota tutto</button></div>
    <label class="cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filtro-sinistra" placeholder="Filtra…" autocomplete="off"></label>
    <div class="lista" id="lista-sinistra"></div>
  </section>

  <!-- ========================================================= CENTRO -->
  <section class="pannello centro" id="zona-chat">
    <div class="testa-chat">
      <div class="avatar"><svg viewBox="0 0 24 24"><path d="M4 10h16M6 10l1.5-5h9L18 10"/><circle cx="8" cy="15" r="3"/><circle cx="16" cy="15" r="3"/><path d="M11 15h2"/></svg><i class="punto" id="punto-chat"></i></div>
      <div>
        <h1>Investigatore LAZZARO</h1>
        <div class="sotto" id="sotto-chat">connessione…</div>
      </div>
      <div class="spazio"></div>
      <button class="icona-btn" id="pulisci" title="Pulisci la vista (lo storico resta)"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </div>
    <div class="messaggi" id="messaggi"></div>
    <div class="input-chat">
      <div class="file-in-esame" id="file-in-esame"></div>
      <div class="riga-input">
        <button class="btn-tondo piu" id="piu" title="Carica file da esaminare (txt, md, csv, json, docx, pdf, zip)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <input type="file" id="file" multiple hidden accept=".txt,.md,.csv,.json,.jsonl,.log,.docx,.pdf,.zip">
        <textarea id="domanda" rows="1" placeholder="Chiedi all'investigatore…  (Invio per inviare, Maiusc+Invio per andare a capo)"></textarea>
        <button class="btn-tondo invia" id="invia" title="Invia"><svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
      </div>
    </div>
    <div class="trascina nascosto" id="trascina">Rilascia i file da esaminare</div>
  </section>

  <!-- ======================================================== DESTRA -->
  <section class="pannello destra">
    <div class="titolo-pannello"><h2>Elementi dell'indagine</h2><span class="conta" id="conta-persone"></span></div>
    <div class="schede-testo" role="tablist" id="schede-elementi">
      <button class="attiva" data-tipo="persone">Persone <span></span></button>
      <button data-tipo="luoghi">Luoghi <span></span></button>
      <button data-tipo="indizi">Indizi <span></span></button>
      <button data-tipo="eventi">Eventi <span></span></button>
    </div>
    <label class="cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filtro-persone" placeholder="Cerca…" autocomplete="off"></label>
    <div class="lista" id="lista-persone"></div>
    <p class="nota-destra" id="nota-destra">Clicca un elemento per aprire i passaggi dei documenti in cui compare.</p>
  </section>
</main>

<script src="comune.js"></script>
<script src="app.js"></script>
</body>
</html>
